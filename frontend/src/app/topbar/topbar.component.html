<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button *ngIf="hayHistorial()" fill="clear" (click)="navigateBack()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <!-- Logo centrado visualmente -->
    <div class="logo-container">
      <img src="assets/images/logo.png" alt="Logo" class="logo" />
    </div>

    <ion-button *ngIf="partidoEnCurso()" fill="clear" (click)="retomarPartido()" slot="end">
      <ion-icon name="play-outline"></ion-icon>
    </ion-button>
    <ion-button *ngIf="esPartido()" fill="clear" (click)="borrarPartido()" slot="end">
      <ion-icon name="trash-outline"></ion-icon>
    </ion-button>
    <ion-button *ngIf="esJugador()" fill="clear" (click)="borrarJugador()" slot="end">
      <ion-icon name="trash-outline"></ion-icon>
    </ion-button>

  </ion-toolbar>
</ion-header>
